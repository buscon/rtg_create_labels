; MySQL / MariaDB access data. Copy this file to db_credentials.ini (same folder)
; and fill in the values from the netcup control panel (Databases).
; db_credentials.ini is never committed to git and is blocked from the web.
host = "localhost"            ; netcup: the host shown in the control panel, without the port
port = 3306
dbname = "your_database_name"
user = "your_database_user"
password = "your_password"
