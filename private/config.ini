; Configuration of the repertory grid elicitation tool
; ----------------------------------------------------
; All values that may change during the test phase are kept here.
; Changes take effect for the NEXT session that starts; no restart is needed.
; A copy of the active configuration is stored with every session, so changes
; remain traceable. Increase config_version whenever a value changes.
; Values marked TEST are proposals to be checked in the test run.
; Lists are separated by " | ". Paths are relative to this folder (private/).
; Text values must be in double quotes.

[study]
name = "Repertory grid study - restorative soundscapes"
config_version = "0.11-test"            ; 0.2: 8 ISD clips, 11 triads; 0.3: no headphone check, listening situation;
                                        ; 0.4: pause when leaving the page, delayed "no difference" button, group settings;
                                        ; 0.5: thinking prompts; 0.6: demographics;
                                        ; 0.7: all thinking prompts at once with titles; test group waits too;
                                        ; 0.8: 11 clips (8 ISD + 3 natural from Silenzi in Quota), 19 triads;
                                        ; 0.9: 15-s clips; task wording "most alike", "recordings" instead of "sounds";
                                        ; 0.10: no practice triad; 0.11: short labels asked for (e.g. 1-3 words), max. 60 characters per field
languages = "de | en"
default_language = "de"

[stimuli]
elements_file = "data/elements.csv"     ; one row per clip: element_id, filename, category
n_clips = 11
clip_duration_s = 15
practice_clips = "practice_1.flac | practice_2.flac | practice_3.flac"
require_full_play = true                ; every clip must be played to the end in every triad
allow_replay = true

[triads]
set_file = "data/triad_set.csv"         ; 19 triads covering all 55 pairs of 11 clips (scripts/make_triad_set.py)
max_triads = 19
randomise_clip_mapping = true
randomise_order = true
randomise_positions = true
practice_triad = false                  ; no practice triad (23 Oct 2026); the first practice clip is still used to set the volume

[prompt]
type = "open"
text_de = "Wählen Sie die zwei Aufnahmen, die sich am meisten ähneln. Beschreiben Sie dann möglichst kurz (z. B. in ein bis drei Wörtern), was die beiden gemeinsam haben und worin sich die dritte unterscheidet."   ; TEST wording
text_en = "Choose the two recordings that are most alike. Then say as briefly as possible (e.g. in one to three words) what the two have in common and how the third one differs."

[labels]
min_words = 1
max_words = 0                           ; 0 = no word limit (participants are asked for short answers, e.g. 1-3 words)
max_chars = 60                          ; TEST: maximum length of one answer field

[stopping]
min_triads = 6                          ; TEST
consecutive_not_new = 3                 ; TEST: end after this many triads in a row without a new construct
time_limit_min = 50                     ; TEST: minutes of triad work, counted from the first real triad
no_difference_counts_as_not_new = true

[similarity]
; "embedding": the browser computes sentence embeddings with the model below;
;              if the model cannot be loaded, the server falls back to text similarity.
; "text":      text similarity only (no model download for participants).
backend = "embedding"
threshold_embedding = 0.85              ; TEST: cosine similarity at or above which a construct is a repetition
threshold_text = 0.85                   ; TEST: text similarity (0-1) used when no embedding is available
embedding_model = "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
embedding_wait_s = 20                   ; how long to wait for the model before falling back to text
compare_both_orientations = true        ; "calm - busy" equals "busy - calm"

[headphone_check]
enabled = false                         ; off since 13 Oct 2026: headphones and loudspeakers are both allowed;
                                        ; the listening device is asked on the "listening situation" page
test = "huggins"                        ; stimuli created by scripts/make_headphone_stimuli.py
n_trials = 6
pass_min_correct = 5                    ; TEST: check against Milne et al. (2021) before use

[device]
block_mobile = true

[access]
; Protection against bots and unintended use of the link (design file 14).
require_code = true                     ; online sessions need a group code in the link: .../rgt/?c=CODE
site_url = "https://marcellolussana.net/rgt/"   ; used to print the invitation links
codes_file = "access_codes.csv"         ; in private/, NOT in git. Create codes on the server with:
                                        ;   php private/setup.php --add-code "group name" MAX_USES (optional: YYYY-MM-DD)
max_sessions_per_ip_hour = 5            ; the test group has no limit (group.test below)
                                        ; new online sessions per IP address and hour (0 = no limit);
                                        ; IP addresses are stored only as salted hashes, for one hour
min_play_fraction = 0.9                 ; a clip counts as heard only if "ended" arrives at least this share
                                        ; of clip_duration_s after its first "play" (server time; 0 = off)

[interface]
pause_when_hidden = true                ; pause playback when the participant switches to another browser tab
                                        ; or minimises the window
pause_on_blur = true                    ; also pause when the browser window loses focus (another program or
                                        ; window is clicked)
no_difference_delay_s = 120             ; the button "I cannot think of a new difference" appears only after all
                                        ; three clips were heard, and this many seconds after that (0 = at once)
demographics = true                     ; page "A few questions about you" (age group, gender, first language,
                                        ; involvement with sound/music, place of residence) before the listening page
thinking_prompts = true                 ; button "Need an idea?" under the text fields: shows all thinking
                                        ; prompts with a title (texts: prompt_1 ..., prompt_title_1 ... in i18n.js)

; ---------------------------------------------------------------------------
; Settings for single groups. Section name: [group.NAME], where NAME is the note of the
; group code in private/access_codes.csv (the name given with --add-code). Lines have the
; form "section.key = value". Only these keys can be set per group:
;   interface.pause_when_hidden, interface.pause_on_blur, interface.no_difference_delay_s,
;   interface.thinking_prompts,
;   stopping.min_triads, stopping.consecutive_not_new, stopping.time_limit_min,
;   triads.max_triads, access.min_play_fraction, access.max_sessions_per_ip_hour
; Invalid group settings are ignored (the general settings apply).

[group.test]
access.max_sessions_per_ip_hour = 0     ; testing: no limit on new sessions
interface.pause_on_blur = false         ; testing: switching to other windows does not pause

[recruitment]
; For the researcher; the tool does not stop recruitment itself.
min_participants = 20
max_participants = 30
saturation_block_size = 5
interviewer_share = 0.20                ; TEST
interviewer_min_sessions = 5            ; TEST

[interviewer]
enabled = true
; The interviewer password is NOT stored here. Create it with:  php private/setup.php --set-token
followup_de = "Was meinen Sie mit „…“? | Was wäre für Sie das Gegenteil?"
followup_en = "What do you mean by “…”? | What would the opposite be for you?"

[server]
db_driver = "mysql"                     ; "mysql" = MySQL/MariaDB (netcup); "sqlite" = local testing only
db_credentials = "db_credentials.ini"   ; mysql: access data (copy db_credentials.example.ini)
db_path = "db/rgt.sqlite"               ; sqlite: database file
